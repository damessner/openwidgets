<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lehrkräfte-Login — OpenWidgets</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    .login-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card { width: min(420px, 100%); }
    .login-brand { justify-content: center; margin-bottom: 24px; }
    .login-footer { margin-top: 20px; display: flex; justify-content: center; }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="login-card card">
      <a class="brand login-brand" href="/">
        <span class="brand-mark" aria-hidden="true">OW</span>
        OpenWidgets
      </a>
      <h1 class="center" style="font-size:1.5rem;margin-bottom:6px" data-i18n="login.title">Anmelden</h1>
      <p class="small muted center mb-4" data-i18n="login.subtitle">
        Für Lehrkräfte dieser Instanz. Schüler:innen treten über den Aufgaben-Link bei.
      </p>

      <div id="login-error" class="error-text mb-3" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label class="label" for="email" data-i18n="common.email">E-Mail</label>
          <input
            class="input"
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
            inputmode="email"
            spellcheck="false"
          >
        </div>
        <div class="field">
          <label class="label" for="password" data-i18n="common.password">Passwort</label>
          <input
            class="input"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="login-submit" type="submit" data-i18n="common.login">
          Anmelden
        </button>
      </form>

      <p class="small faint center mt-4 mb-0" data-i18n="login.selfhosted_note">
        Diese Instanz wird selbst gehostet. Passwort vergessen? Bitte an die Administration wenden.
      </p>
      <div class="login-footer">
        <div id="lang-slot"></div>
      </div>
    </div>
  </main>

  <script type="module" src="/login.js"></script>
</body>
</html>
