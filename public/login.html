<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lehrkräfte-Login — OpenWidgets</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body {
      background-image:
        radial-gradient(900px 460px at 85% -10%, rgb(15 118 110 / 11%), transparent 62%),
        radial-gradient(760px 420px at -10% 110%, rgb(217 119 6 / 8%), transparent 58%);
    }
    .login-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .login-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(76px);
      pointer-events: none;
      z-index: 0;
    }
    .login-blob-a {
      width: 340px; height: 340px;
      top: -90px; right: -70px;
      background: rgb(15 118 110 / 16%);
    }
    .login-blob-b {
      width: 300px; height: 300px;
      bottom: -110px; left: -60px;
      background: rgb(217 119 6 / 12%);
    }
    .login-card {
      width: min(430px, 100%);
      position: relative;
      z-index: 1;
      padding: 32px;
      border-radius: var(--radius-lg);
      border-top: 4px solid var(--primary);
      box-shadow: var(--shadow-lg);
    }
    .login-brand { justify-content: center; margin-bottom: 20px; font-size: 1.15rem; }
    .login-brand .brand-mark { width: 40px; height: 40px; border-radius: 12px; font-size: 1.05rem; }
    .login-title { font-size: 1.5rem; margin-bottom: 6px; }
    .login-mode { width: 100%; }
    .login-mode button { flex: 1 1 0; }
    .login-footer { margin-top: 20px; display: flex; justify-content: center; }
    .demo-hint {
      background: var(--warning-soft);
      color: var(--warning);
      border: 1px solid rgb(165 90 0 / 25%);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      line-height: 1.45;
      text-align: left;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-image:
          radial-gradient(900px 460px at 85% -10%, rgb(45 212 191 / 12%), transparent 62%),
          radial-gradient(760px 420px at -10% 110%, rgb(251 191 36 / 8%), transparent 58%);
      }
      .login-blob-a { background: rgb(45 212 191 / 14%); }
      .login-blob-b { background: rgb(251 191 36 / 10%); }
      .demo-hint { border-color: rgb(251 191 36 / 30%); }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="login-blob login-blob-a" aria-hidden="true"></div>
    <div class="login-blob login-blob-b" aria-hidden="true"></div>
    <div class="login-card card">
      <a class="brand login-brand" href="/">
        <span class="brand-mark" aria-hidden="true">OW</span>
        OpenWidgets
      </a>
      <h1 class="center login-title" data-i18n="login.title">Anmelden</h1>
      <p class="small muted center mb-3" data-i18n="login.subtitle">
        Lehrkräfte melden sich mit E-Mail an, Schüler:innen mit ihrem generated Login.
      </p>

      <div class="segmented login-mode mb-4" role="group" aria-label="Login-Modus">
        <button type="button" id="mode-teacher" class="is-active" data-i18n="login.mode_teacher">Lehrkraft</button>
        <button type="button" id="mode-student" data-i18n="login.mode_student">Schüler:in</button>
      </div>

      <div id="demo-hint" class="demo-hint" role="status" hidden></div>

      <div id="login-error" class="error-text mb-3" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label class="label" for="email" id="email-label" data-i18n="common.email">E-Mail</label>
          <input
            class="input"
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
            inputmode="email"
            spellcheck="false"
          >
        </div>
        <div class="field">
          <label class="label" for="password" data-i18n="common.password">Passwort</label>
          <input
            class="input"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>
        <button class="btn btn-primary btn-block btn-lg" id="login-submit" type="submit" data-i18n="common.login">
          Anmelden
        </button>
      </form>

      <p class="small faint center mt-4 mb-0" data-i18n="login.selfhosted_note">
        Diese Instanz wird selbst gehostet. Passwort vergessen? Bitte an die Administration wenden.
      </p>
      <div class="login-footer">
        <div id="lang-slot"></div>
      </div>
      <p class="small faint center mb-0" style="margin-top:14px" data-i18n="login.compliance">
        DSGVO-konform · selbst gehostet · keine Drittanbieter-CDNs
      </p>
    </div>
  </main>

  <script type="module" src="/login.js"></script>
</body>
</html>
